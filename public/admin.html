<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NUSALA 26 — Admin</title>
<meta name="robots" content="noindex">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 17px; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #241452; color: #fff; padding-bottom: 110px; }
.wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
h1 { color: #f6b21b; font-size: 1.3rem; padding: 4px 0 12px; }
h2 { color: #f6b21b; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.5px; margin: 26px 0 8px; }
.card { background: #fdf9f0; border-radius: 12px; padding: 14px; margin-top: 10px; color: #26215c; }
input, textarea, select { width: 100%; font-family: inherit; font-size: 1rem; padding: 10px; border: 1.5px solid #c9bfa4; border-radius: 8px; background: #fff; color: #26215c; min-height: 44px; }
textarea { resize: vertical; min-height: 60px; }
label { display: block; font-size: 0.8rem; font-weight: 600; color: #5f5e5a; margin: 8px 0 3px; }
button { font-family: inherit; font-size: 0.95rem; font-weight: 600; border: none; border-radius: 8px; padding: 11px 16px; cursor: pointer; min-height: 44px; }
.gold { background: #f6b21b; color: #412402; }
.purple { background: #3b2a75; color: #fff; }
.danger { background: #fbe9e9; color: #a32d2d; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > * { flex: 1; }
.row .sm { flex: 0 0 auto; }
.ev-row { border-bottom: 1px solid #eee3c8; padding: 12px 0; }
.ev-row:last-child { border-bottom: none; }
.times { display: flex; gap: 8px; }
.times input { flex: 1; }
.chips { display: flex; gap: 8px; margin: 10px 0; }
.chips button { flex: 1; background: #3b2a75; color: #cfc4f0; border-radius: 22px; }
.chips button.on { background: #f6b21b; color: #412402; }
#savebar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,10,45,0.95); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; }
#savebar button { flex: 1; max-width: 260px; }
#status { text-align: center; font-size: 0.85rem; color: #cfc4f0; padding: 8px; min-height: 1.5em; }
.hidden { display: none !important; }
small.hint { color: #8a86a8; display: block; margin-top: 6px; font-size: 0.75rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>NUSALA 26 · Admin</h1>

  <div id="login" class="card">
    <label for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div style="margin-top:10px;"><button class="gold" onclick="login()">Sign in</button></div>
    <small class="hint">Wrong passwords fail on first save — this screen only stores the key on this device.</small>
  </div>

  <div id="panel" class="hidden">

    <h2>Announcements</h2>
    <div class="card">
      <textarea id="new-ann" placeholder="Type an announcement… e.g. Dinner moved to 8 pm"></textarea>
      <div class="row" style="margin-top:8px;">
        <button class="purple" onclick="addAnn(false)">Post</button>
        <button class="gold" onclick="addAnn(true)">Post + notify everyone</button>
      </div>
      <div id="ann-list"></div>
    </div>

    <h2>Schedule</h2>
    <div class="chips" id="admin-chips"></div>
    <div class="card" id="ev-list"></div>

    <h2>Speakers</h2>
    <div class="card" id="sp-list"></div>

    <h2>Venue</h2>
    <div class="card">
      <label for="v-name">Venue name</label>
      <input id="v-name" onchange="uv('name',this.value)">
      <label for="v-room">Room</label>
      <input id="v-room" placeholder="Barcelona Room" onchange="uv('room',this.value)">
      <label for="v-address">Address (opens in Maps)</label>
      <input id="v-address" onchange="uv('address',this.value)">
      <label for="v-phone">Phone (tap to call)</label>
      <input id="v-phone" type="tel" onchange="uv('phone',this.value)">
      <label for="v-email">Email</label>
      <input id="v-email" type="email" onchange="uv('email',this.value)">
      <small class="hint">Leave a field blank to hide that row on the Info page.</small>
    </div>

    <h2>NUSA updates</h2>
    <div class="card" id="up-list"></div>

    <h2>Sponsors</h2>
    <div class="card" id="spon-list"></div>

    <h2>Photo wall</h2>
    <div class="card">
      <div class="row"><button class="purple" onclick="loadPhotos()">Load photos</button></div>
      <label>Waiting for approval</label>
      <div id="pending-admin" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px;"></div>
      <label>Live on the wall</label>
      <div id="photo-admin" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px;"></div>
    </div>

    <h2>Settings</h2>
    <div class="card">
      <label for="donate">Donate link (blank hides the Donate button)</label>
      <input id="donate" type="url" placeholder="https://…">
      <label for="footer">Info page footer line</label>
      <textarea id="footer" placeholder="NUSALA 26 · Nnewi USA · Empowering the next generation"></textarea>
    </div>

  </div>
</div>

<div id="savebar" class="hidden">
  <button class="gold" onclick="save(false)">Save changes</button>
  <button class="purple" onclick="save(true)">Save + notify</button>
</div>
<div id="status" style="position:fixed;bottom:76px;left:0;right:0;"></div>

<script>
let DATA = null;
let day = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key = () => localStorage.getItem("adminKey") || "";

function login() {
  localStorage.setItem("adminKey", $("#pw").value.trim());
  boot();
}

async function boot() {
  if (!key()) return;
  const r = await fetch("/api/data", { cache: "no-store" });
  if (!r.ok) { setStatus("Couldn't load data"); return; }
  DATA = await r.json();
  day = DATA.days[0].date;
  $("#login").classList.add("hidden");
  $("#panel").classList.remove("hidden");
  $("#savebar").classList.remove("hidden");
  renderAll();
}

function renderAll() {
  $("#donate").value = DATA.donateUrl || "";
  $("#footer").value = DATA.footer || "";
  if (!DATA.venue) DATA.venue = {};
  for (const f of ["name", "room", "address", "phone", "email"]) $("#v-" + f).value = DATA.venue[f] || "";
  if (!Array.isArray(DATA.updates)) DATA.updates = [];
  if (!Array.isArray(DATA.sponsors)) DATA.sponsors = [];
  renderAnns(); renderChips(); renderEvents(); renderSpeakers(); renderUpdates(); renderSponsors();
}
function uv(field, v) { DATA.venue[field] = v.trim(); }

/* Image upload — used by updates and sponsors */
// ponytail: one hidden file input reused for every image field, target picked at click time
async function pickImage(onDone) {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*";
  inp.onchange = async () => {
    const file = inp.files[0];
    if (!file) return;
    setStatus("Uploading image…");
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * scale);
      c.height = Math.round(bmp.height * scale);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
      const r = await fetch("/api/upload", {
        method: "POST",
        headers: { "content-type": "image/jpeg", "x-admin-key": key() },
        body: blob,
      });
      if (!r.ok) throw new Error();
      const { url } = await r.json();
      onDone(url);
      setStatus("Image uploaded — remember to save");
    } catch (e) {
      setStatus("Image upload failed");
    }
  };
  inp.click();
}

/* NUSA updates */
function renderUpdates() {
  $("#up-list").innerHTML = DATA.updates.map((u, i) => `
    <div class="ev-row">
      <div class="row">
        <input value="${esc(u.title || "")}" placeholder="Update title" onchange="uup(${i},'title',this.value)">
        <button class="danger sm" onclick="delUpdate(${i})">✕</button>
      </div>
      <label>Message</label>
      <textarea onchange="uup(${i},'text',this.value)">${esc(u.text || "")}</textarea>
      <label>Link (optional)</label>
      <input value="${esc(u.link || "")}" placeholder="https://…" onchange="uup(${i},'link',this.value)">
      <label>Photo (optional)</label>
      <div class="row">
        ${u.img ? `<img src="${esc(u.img)}" style="max-height:60px;border-radius:6px;flex:0 0 auto;">` : '<small class="hint" style="flex:1;">No photo</small>'}
        <button class="purple sm" onclick="pickImage(url => { DATA.updates[${i}].img = url; renderUpdates(); })">${u.img ? "Replace" : "Add photo"}</button>
        ${u.img ? `<button class="danger sm" onclick="DATA.updates[${i}].img=''; renderUpdates()">Remove</button>` : ""}
      </div>
    </div>`).join("") +
    `<div style="margin-top:10px;"><button class="purple" onclick="addUpdate()">+ Add update</button></div>`;
}
function uup(i, f, v) { DATA.updates[i][f] = v; }
function delUpdate(i) { if (confirm("Delete this update?")) { DATA.updates.splice(i, 1); renderUpdates(); } }
function addUpdate() { DATA.updates.push({ id: Date.now(), title: "", text: "", link: "", img: "" }); renderUpdates(); }

/* Sponsors */
const TIERS = ["Presenting sponsor", "Platinum sponsor", "Gold sponsor", "Silver sponsor", "Community partner"];
function renderSponsors() {
  $("#spon-list").innerHTML = DATA.sponsors.map((s, i) => `
    <div class="ev-row">
      <div class="row">
        <input value="${esc(s.name || "")}" placeholder="Sponsor name" onchange="usn(${i},'name',this.value)">
        <button class="danger sm" onclick="delSponsor(${i})">✕</button>
      </div>
      <label>Tier</label>
      <select onchange="usn(${i},'tier',this.value)">
        ${TIERS.map(t => `<option ${s.tier === t ? "selected" : ""}>${t}</option>`).join("")}
      </select>
      <label>Website (optional)</label>
      <input value="${esc(s.url || "")}" placeholder="https://…" onchange="usn(${i},'url',this.value)">
      <label>Logo</label>
      <div class="row">
        ${s.logo ? `<img src="${esc(s.logo)}" style="max-height:60px;border-radius:6px;flex:0 0 auto;">` : '<small class="hint" style="flex:1;">No logo</small>'}
        <button class="purple sm" onclick="pickImage(url => { DATA.sponsors[${i}].logo = url; renderSponsors(); })">${s.logo ? "Replace" : "Add logo"}</button>
        ${s.logo ? `<button class="danger sm" onclick="DATA.sponsors[${i}].logo=''; renderSponsors()">Remove</button>` : ""}
      </div>
    </div>`).join("") +
    `<div style="margin-top:10px;"><button class="purple" onclick="addSponsor()">+ Add sponsor</button></div>`;
}
function usn(i, f, v) { DATA.sponsors[i][f] = v; }
function delSponsor(i) { if (confirm("Remove this sponsor?")) { DATA.sponsors.splice(i, 1); renderSponsors(); } }
function addSponsor() { DATA.sponsors.push({ id: Date.now(), name: "", tier: TIERS[2], url: "", logo: "" }); renderSponsors(); }

function setStatus(t) {
  $("#status").textContent = t;
  clearTimeout(window._st); window._st = setTimeout(() => $("#status").textContent = "", 5000);
}

/* Announcements */
function renderAnns() {
  $("#ann-list").innerHTML = (DATA.announcements || []).slice().sort((a,b) => new Date(b.time) - new Date(a.time))
    .map((a,i) => `<div class="ev-row row">
      <div>${esc(a.text)}<small class="hint">${new Date(a.time).toLocaleString()}</small></div>
      <button class="danger sm" onclick="delAnn(${a.id})">Delete</button>
    </div>`).join("");
}
function addAnn(alsoNotify) {
  const t = $("#new-ann").value.trim();
  if (!t) return;
  DATA.announcements.unshift({ id: Date.now(), time: new Date().toISOString(), text: t });
  $("#new-ann").value = "";
  renderAnns();
  save(alsoNotify);
}
function delAnn(id) {
  if (!confirm("Delete this announcement?")) return;
  DATA.announcements = DATA.announcements.filter(a => a.id !== id);
  renderAnns();
}

/* Schedule */
function renderChips() {
  $("#admin-chips").innerHTML = DATA.days.map(d =>
    `<button class="${d.date===day?"on":""}" onclick="day='${d.date}';renderChips();renderEvents()">${esc(d.label.slice(0,3))}</button>`).join("");
}
function curDay() { return DATA.days.find(d => d.date === day); }
function renderEvents() {
  const d = curDay();
  $("#ev-list").innerHTML = d.events.map((ev,i) => `
    <div class="ev-row" data-i="${i}">
      <div class="times">
        <input type="time" value="${ev.start}" onchange="upd(${i},'start',this.value)">
        <input type="time" value="${ev.end}" onchange="upd(${i},'end',this.value)">
        <button class="danger sm" onclick="delEv(${i})">✕</button>
      </div>
      <label>Title</label>
      <input value="${esc(ev.title)}" onchange="upd(${i},'title',this.value)">
      <label>Details (optional)</label>
      <input value="${esc(ev.note || "")}" onchange="upd(${i},'note',this.value)">
      <label>Location (optional)</label>
      <input value="${esc(ev.location || "")}" onchange="upd(${i},'location',this.value)">
    </div>`).join("") +
    `<div style="margin-top:10px;"><button class="purple" onclick="addEv()">+ Add event to ${esc(d.label)}</button></div>`;
}
function upd(i, f, v) { curDay().events[i][f] = v; }
function delEv(i) {
  if (!confirm("Delete this event?")) return;
  curDay().events.splice(i, 1); renderEvents();
}
function addEv() {
  curDay().events.push({ id: "e" + Date.now(), start: "12:00", end: "13:00", title: "New event", note: "", location: "" });
  renderEvents();
}

/* Speakers */
function renderSpeakers() {
  $("#sp-list").innerHTML = DATA.speakers.map((sp,i) => `
    <div class="ev-row">
      <div class="row">
        <input value="${esc(sp.name)}" placeholder="Name" onchange="usp(${i},'name',this.value)">
        <button class="danger sm" onclick="delSp(${i})">✕</button>
      </div>
      <label>Role</label>
      <input value="${esc(sp.role || "")}" onchange="usp(${i},'role',this.value)">
      <label>Bio (optional)</label>
      <input value="${esc(sp.bio || "")}" onchange="usp(${i},'bio',this.value)">
      <label>Photo URL (optional)</label>
      <input value="${esc(sp.photo || "")}" onchange="usp(${i},'photo',this.value)">
    </div>`).join("") +
    `<div style="margin-top:10px;"><button class="purple" onclick="addSp()">+ Add person</button></div>`;
}
function usp(i, f, v) { DATA.speakers[i][f] = v; }
function delSp(i) { if (confirm("Remove this person?")) { DATA.speakers.splice(i,1); renderSpeakers(); } }
function addSp() { DATA.speakers.push({ name: "", role: "", bio: "", photo: "" }); renderSpeakers(); }

/* Photo moderation */
async function loadPhotos() {
  const [live, pend] = await Promise.all([
    fetch("/api/photos", { cache: "no-store" }).then(r => r.json()),
    fetch("/api/pending", { cache: "no-store", headers: { "x-admin-key": key() } }).then(r => r.ok ? r.json() : { photos: [] }),
  ]);
  const tile = (p, extra) => `
    <div>
      <img src="/api/photo/${p.id}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;" loading="lazy">
      <small class="hint">${esc(p.n || "anonymous")}</small>
      ${extra}
      <button class="danger" style="width:100%;margin-top:4px;padding:6px;" onclick="delPhoto('${p.id}')">Delete</button>
    </div>`;
  document.querySelector("#pending-admin").innerHTML = pend.photos.map(p =>
    tile(p, `<button class="gold" style="width:100%;margin-top:4px;padding:6px;" onclick="approvePhoto('${p.id}')">Approve</button>`)
  ).join("") || '<small class="hint">Nothing waiting.</small>';
  document.querySelector("#photo-admin").innerHTML = live.photos.map(p => tile(p, "")).join("") || '<small class="hint">No photos yet.</small>';
}
async function approvePhoto(id) {
  await fetch("/api/approve/" + id, { method: "POST", headers: { "x-admin-key": key() } });
  setStatus("Approved — live on the wall");
  loadPhotos();
}
async function delPhoto(id) {
  if (!confirm("Delete this photo?")) return;
  await fetch("/api/photo/" + id, { method: "DELETE", headers: { "x-admin-key": key() } });
  setStatus("Photo deleted");
  loadPhotos();
}

/* Save */
async function save(alsoNotify) {
  DATA.donateUrl = $("#donate").value.trim();
  DATA.footer = $("#footer").value.trim();
  // ponytail: read venue straight from the inputs at save time, so a field still
  // focused when Save is tapped can't be silently dropped
  for (const f of ["name", "room", "address", "phone", "email"]) DATA.venue[f] = $("#v-" + f).value.trim();
  if (!DATA.venue.name) { setStatus("Venue name can't be empty"); return; }
  setStatus("Saving…");
  const r = await fetch("/api/data", {
    method: "POST",
    headers: { "content-type": "application/json", "x-admin-key": key() },
    body: JSON.stringify(DATA),
  });
  if (r.status === 401) { setStatus("Wrong password — sign in again"); localStorage.removeItem("adminKey"); location.reload(); return; }
  if (!r.ok) { setStatus("Save failed — try again"); return; }
  const j = await r.json();
  DATA.updated = j.updated;
  if (alsoNotify) {
    setStatus("Saved. Sending notifications…");
    const latest = (DATA.announcements[0] || {}).text || "Schedule updated";
    const n = await fetch("/api/notify", {
      method: "POST",
      headers: { "content-type": "application/json", "x-admin-key": key() },
      body: JSON.stringify({ title: "NUSALA 26", body: latest }),
    });
    const nj = n.ok ? await n.json() : null;
    setStatus(nj ? `Saved · notified ${nj.sent} phones (${nj.total} subscribed)` : "Saved · notify failed");
  } else {
    setStatus("Saved ✓ — phones update within a minute");
  }
}

boot();
</script>
</body>
</html>
